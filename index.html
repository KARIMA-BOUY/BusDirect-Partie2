
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>document</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800">
  <header class="bg-white text-slate-800 border-b border-slate-200 shadow-sm sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <div class="flex items-center space-x-4">
          <div class="bg-indigo-900 text-amber-400 p-3 rounded-xl shadow-md">
            <i class="fa-solid fa-bus text-2xl"></i>
          </div>
          <div>
            <h1 class="text-2xl font-black text-indigo-950 tracking-wide">BusDirect</h1>
            <div class="flex items-center space-x-2 text-slate-600 text-sm font-medium">
          </div>
    </header>
    <main class="max-w-7xl mx-auto p-6">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-3xl font-bold">Choisissez votre trajet </h2>
            <div class="bg-white p-3 rounded-xl border">
                <i class="fa-solid fa-bus"></i>
                <span id="active-trips-count">20 trajets actifs </span>
            </div>
        </div>
        <div class="bg-white p-6 rounded-2xl border">
            <div class="flex flex-col md:flex-row justify-between gap-4 mb-6">
                <div>
                    <h3 class="text-lg font-bold"> Trajets programmes</h3>
                    <p id="results-count" class="text-sm text-gray-500">20 résultats trouves </p>
                </div>
                <div>
                    <input type="text" id="search" placeholder="Rechercher une ville..." class="border p-3 rounded-xl w-full">
                </div>
    <div class="flex gap-2">
<select id="status-filter">
    <option value="tout">Tous</option>
    <option value="disponible">Disponibles</option>
    <option value="complete">Complets</option>
</select>
   </div>
            </div>
            <div id="trips-grid"class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
            </div>
            <div id="pagination" class="flex justify-center gap-3 mt-6"></div>
            <div id="empty-state" class="hidden text-center p-10">
                <i class="fa-solid fa-bus text-3xl text-gray-400"></i>
                <h4 class="font-bold mt-3"> Aucun trajet trouve</h4>
                <p class="text-sm text-gray-500">Essayez de modifier votre recherche ou vos filtres </p>
            </div>
        </div>
    </main>
    <script type="module" src="./js/main-trajets.js"></script>
</body>
</html>
